name: Browser smoke for site release review
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and browser driver
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Build simulated unconfigured-form preview
        run: VITE_WEB3FORMS_ACCESS_KEY='' npm run build
      - name: Start production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/site-preview.log 2>&1 &
          echo $! > /tmp/site-preview.pid
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fIs http://127.0.0.1:4173/ | head
      - name: Test actual browser and take screenshots
        shell: bash
        run: |
          mkdir -p /tmp/noemi-smoke
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({channel: 'chrome', headless: true, args: ['--no-sandbox']});
            try {
              const page = await browser.newPage({viewport:{width:1365,height:920}});
              const errors = [];
              page.on('pageerror',e=>errors.push(e.message));
              const routes = ['/', '/it', '/fr', '/es', '/it/contatti', '/it/esempi-di-lavoro', '/blog', '/en/blog', '/fr/blog', '/es/blog', '/en/blog/communicating-with-italian-customers', '/fr/blog/communiquer-avec-ses-clients-italiens', '/es/blog/comunicacion-con-clientes-italianos-localizacion', '/en-not-a-page'];
              for (const path of routes) {
                const resp = await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle',timeout:20000});
                if(!resp || resp.status()!==200) throw new Error('Route '+path+' HTTP '+resp?.status());
                const text = await page.locator('body').innerText();
                if (text.length < 150) throw new Error('Too little rendered text for '+path+': '+text.length);
                const safe = path.replace(/[^a-z0-9]/gi,'_')||'home';
                await page.screenshot({path:'/tmp/noemi-smoke/'+safe+'.png',fullPage:true});
                console.log('PASS route '+path+' content chars='+text.length+' title='+await page.title());
              }
              for (const path of ['/portfolio-documenti/doc-01-localizzazione-interior-design.html','/portfolio-documenti/doc-20-richiesta-preventivo-workflow.html']) {
                const response = await page.request.get('http://127.0.0.1:4173'+path);
                const text = await response.text();
                if(!response.ok() || text.length<1000 || !text.includes('<html')) throw new Error('Document not reachable: '+path);
                console.log('PASS HTML portfolio document '+path);
              }
              // Validate real translated article text, canonical URLs and reciprocal hreflang tags.
              const internationalBlogCases = [
                {lang:'en',path:'/en/blog/communicating-with-italian-customers',title:'Communicating with Italian customers'},
                {lang:'fr',path:'/fr/blog/communiquer-avec-ses-clients-italiens',title:'Communiquer avec ses clients italiens'},
                {lang:'es',path:'/es/blog/comunicacion-con-clientes-italianos-localizacion',title:'Comunicación con clientes italianos'}
              ];
              for (const check of internationalBlogCases) {
                await page.goto('http://127.0.0.1:4173'+check.path,{waitUntil:'networkidle'});
                const heading=await page.locator('article h1').innerText();
                if(!heading.includes(check.title)) throw new Error('Translated article heading missing: '+check.path+' '+heading);
                const htmlLang=await page.locator('html').getAttribute('lang');
                if(htmlLang!==check.lang) throw new Error('HTML language incorrect at '+check.path+': '+htmlLang);
                const canonical=await page.locator('link[rel="canonical"]').getAttribute('href');
                if(canonical!=='https://www.noemitomassetti.it'+check.path) throw new Error('Incorrect canonical at '+check.path+': '+canonical);
                const alts=await page.locator('link[rel="alternate"][hreflang]').count();
                if(alts!==5) throw new Error('Expected five hreflang references at '+check.path+', got '+alts);
                console.log('PASS translated article + language + canonical + hreflang '+check.path);
              }
              const itBlogArticle='http://127.0.0.1:4173/blog/supporto-multilingue-come-gestire-richieste-e-comunicazioni-in-inglese-francese-e-spagnolo';
              await page.goto(itBlogArticle,{waitUntil:'networkidle'});
              if(await page.locator('html').getAttribute('lang')!=='it') throw new Error('Original blog article must remain Italian');
              console.log('PASS original Italian blog slug preserved');

              // Specifically guard against clipped header links on narrow mobile/laptop/wide screens.
              for (const width of [390, 768, 1365, 1536]) {
                await page.setViewportSize({width,height:900});
                await page.goto('http://127.0.0.1:4173/it',{waitUntil:'networkidle'});
                const clipped = await page.locator('header a, header button').evaluateAll(elements =>
                  elements.filter(el => {
                    const r=el.getBoundingClientRect();
                    const style=getComputedStyle(el);
                    return style.display!=='none' && r.width>0 && (r.left < -2 || r.right > innerWidth+2);
                  }).map(el=>el.textContent?.trim() || el.getAttribute('aria-label') || 'unknown')
                );
                if (clipped.length) throw new Error('Header clipped at '+width+'px: '+clipped.join(', '));
                await page.screenshot({path:'/tmp/noemi-smoke/responsive_'+width+'.png',fullPage:false});
                console.log('PASS responsive header '+width+'px');
                if (width===390) {
                  await page.getByRole('button',{name:'Toggle navigation menu'}).click();
                  if(!await page.getByRole('navigation').count()) throw new Error('Mobile nav missing');
                  console.log('PASS mobile menu');
                }
              }
              // Portfolio quality gate: all four languages, two viewport sizes, keyboard use and real sample routes.
              const portfolioRoutes = [
                {lang:'it',path:'/it/esempi-di-lavoro'},
                {lang:'en',path:'/work-examples'},
                {lang:'fr',path:'/fr/exemples-de-projets'},
                {lang:'es',path:'/es/ejemplos-de-trabajo'}
              ];
              for(const item of portfolioRoutes) {
                for(const width of [390,1365]) {
                  await page.setViewportSize({width,height:900});
                  await page.goto('http://127.0.0.1:4173'+item.path,{waitUntil:'networkidle'});
                  const rejectCookies=page.getByRole('button',{name:/^(Rifiuta|Decline|Refuser|Rechazar)$/i}).first();
                  if(await rejectCookies.isVisible()) await rejectCookies.click();
                  const lang=await page.locator('html').getAttribute('lang');
                  if(lang!==item.lang) throw Error('Portfolio locale mismatch '+item.path+': '+lang);
                  const buttons=page.locator('article button[aria-expanded]');
                  const count=await buttons.count();
                  if(count!==18) throw Error('Expected 18 accessible case studies '+item.path+', got '+count);
                  const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+3);
                  if(overflow) throw Error('Horizontal page overflow for '+item.path+' at '+width+'px');
                  await page.screenshot({path:'/tmp/noemi-smoke/portfolio_'+item.lang+'_'+width+'_top.png',fullPage:false});
                  const first=buttons.first();
                  const before=await first.getAttribute('aria-expanded');
                  await first.focus();
                  await page.keyboard.press('Enter');
                  const after=await first.getAttribute('aria-expanded');
                  if(before===after) throw Error('Portfolio case not keyboard-operable: '+item.path);
                  await page.screenshot({path:'/tmp/noemi-smoke/portfolio_'+item.lang+'_'+width+'.png',fullPage:false});
                  console.log('PASS portfolio '+item.lang+' '+width+'px, 18 cases, accessible accordion, no horizontal overflow');
                }
              }
              const portfolioSamples=[
                {lang:'it',path:'/it/esempi-di-lavoro/esempio/12',num:'12'},
                {lang:'en',path:'/work-examples/sample/22',num:'22'},
                {lang:'fr',path:'/fr/exemples-de-projets/exemple/17',num:'17'},
                {lang:'es',path:'/es/ejemplos-de-trabajo/ejemplo/18',num:'18'}
              ];
              for(const item of portfolioSamples) {
                for(const width of [390,1365]) {
                  await page.setViewportSize({width,height:900});
                  await page.goto('http://127.0.0.1:4173'+item.path,{waitUntil:'networkidle'});
                  const language=await page.locator('html').getAttribute('lang');
                  if(language!==item.lang) throw Error('Wrong sample document language '+item.path+': '+language);
                  if(await page.locator('main h1').count()!==1) throw Error('Missing document heading '+item.path);
                  const original=await page.locator('main iframe').getAttribute('src');
                  if(!original?.startsWith('/portfolio-documenti/doc-'+item.num+'-')) throw Error('Wrong sample iframe '+item.path+': '+original);
                  const response=await page.request.get('http://127.0.0.1:4173'+original);
                  if(response.status()!==200) throw Error('Original sample unreachable '+original);
                  if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+3))
                    throw Error('Sample horizontal overflow '+item.path+' at '+width+'px');
                  const alternateCount=await page.locator('link[rel="alternate"][hreflang]').count();
                  if(alternateCount!==5) throw Error('Sample alternate-language SEO links missing '+item.path);
                  await page.screenshot({path:'/tmp/noemi-smoke/sample_'+item.lang+'_'+item.num+'_'+width+'.png',fullPage:false});
                  console.log('PASS guided sample '+item.path+' '+width+'px, localized page + reachable original');
                }
              }
              // Exhaustive portfolio reader audit, not just four representative samples:
              // every one of the 22 deliverables must be available in all four languages
              // on a 390px phone without horizontal overflow, broken source documents or
              // accidentally missing SEO language alternates. Do not send real form data.
              const samplePrefixes={
                it:'/it/esempi-di-lavoro/esempio/',
                en:'/work-examples/sample/',
                fr:'/fr/exemples-de-projets/exemple/',
                es:'/es/ejemplos-de-trabajo/ejemplo/'
              };
              const checkedOriginals=new Set();
              await page.setViewportSize({width:390,height:850});
              for(const [locale,prefix] of Object.entries(samplePrefixes)) {
                for(let doc=1;doc<=22;doc++) {
                  const id=String(doc).padStart(2,'0'), route=prefix+id;
                  await page.goto('http://127.0.0.1:4173'+route,{waitUntil:'domcontentloaded',timeout:20000});
                  const visible=await page.locator('main').last().innerText();
                  const heading=await page.locator('main h1').count();
                  if(heading!==1 || visible.length<700) throw Error('Reader missing content '+route);
                  if(await page.locator('html').getAttribute('lang')!==locale) throw Error('Reader lang incorrect '+route);
                  if(await page.locator('main iframe[title]').count()!==1) throw Error('Accessible work-sample iframe missing '+route);
                  const src=await page.locator('main iframe').getAttribute('src');
                  if(!src?.startsWith('/portfolio-documenti/doc-'+id+'-')) throw Error('Incorrect original for '+route+': '+src);
                  if(!checkedOriginals.has(src)) {
                    const asset=await page.request.get('http://127.0.0.1:4173'+src);
                    const source=await asset.text();
                    if(asset.status()!==200 || !source.includes('<html') || !source.includes('Guide multilingue / Multilingual reading guide'))
                      throw Error('Original file or multilingual guide missing '+src);
                    checkedOriginals.add(src);
                  }
                  if(await page.locator('link[rel="alternate"][hreflang]').count()!==5) throw Error('Missing document hreflang '+route);
                  if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+3)) throw Error('Phone horizontal overflow '+route);
                }
                await page.screenshot({path:'/tmp/noemi-smoke/portfolio_readers_'+locale+'_390.png',fullPage:false});
                console.log('PASS all 22 guided reader documents in '+locale+', 390px, linked assets, a11y and SEO');
              }
              if(checkedOriginals.size!==22) throw Error('Expected 22 distinct source documents; got '+checkedOriginals.size);
              console.log('PASS all 88 localized reader routes and 22 individual source documents');

              await page.setViewportSize({width:390,height:900});
              await page.goto('http://127.0.0.1:4173/work-examples/sample/17',{waitUntil:'networkidle'});
              await page.locator('nav[aria-label="Language / Langue / Idioma"] a[lang="fr"]').click();
              await page.waitForURL('**/fr/exemples-de-projets/exemple/17');
              if(await page.locator('html').getAttribute('lang')!=='fr')
                throw Error('Document language switch failed to keep sample and locale');
              console.log('PASS EN to FR language switch preserves the same portfolio sample');

              // New detailed dossier audit: all 27 fictional work samples in 4 languages.
              // Render at phone width to catch broken paths, SEO alternates, missing
              // deliverables and horizontal overflow in parallel translation panels.
              const dossierSlugs=[
                'en-it-digital-onboarding','it-en-consultancy-services','fr-it-handmade-product',
                'it-fr-professional-training','es-it-existing-customer','it-es-product-information',
                'it-en-existing-order','en-it-professional-faq','fr-it-workshop-details',
                'it-fr-product-order-guide','es-it-existing-customer-onboarding','it-es-workshop-reminder',
                'inbox-calendar-triage','customer-care-escalations','order-entry-price-list',
                'shared-drive-version-control','online-course-secretariat','research-existing-italian-customers',
                'web-copy-before-after','catalogue-price-list-proofreading','digital-tools-request-workflow',
                'commercial-quote-from-approved-pricelist','international-client-italian-aftercare',
                'course-information-source-audit','existing-client-notice-editing',
                'website-help-page-microcopy','existing-customer-multilingual-email-pack'
              ];
              const dossierPrefixes={
                it:'/it/esempi-di-lavoro/dossier/',
                en:'/work-examples/dossier/',
                fr:'/fr/exemples-de-projets/dossier/',
                es:'/es/ejemplos-de-trabajo/dossier/'
              };
              await page.setViewportSize({width:390,height:850});
              for(const [locale,prefix] of Object.entries(dossierPrefixes)) {
                for(const slug of dossierSlugs){
                  const route=prefix+slug;
                  await page.goto('http://127.0.0.1:4173'+route,{waitUntil:'domcontentloaded',timeout:20000});
                  await page.locator('main h1').waitFor({timeout:12000});
                  const body=await page.locator('main').innerText();
                  if(body.length<900) throw Error('Incomplete deep dossier '+route+' ('+body.length+' chars)');
                  if(await page.locator('html').getAttribute('lang')!==locale) throw Error('Dossier locale mismatch '+route);
                  if(await page.locator('link[rel="alternate"][hreflang]').count()!==5) throw Error('Missing dossier hreflang '+route);
                  const canonical=await page.locator('link[rel="canonical"]').getAttribute('href');
                  if(canonical!=='https://www.noemitomassetti.it'+route) throw Error('Wrong canonical '+route+': '+canonical);
                  if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+3)) throw Error('Dossier phone overflow '+route);
                }
                await page.screenshot({path:'/tmp/noemi-smoke/dossiers_'+locale+'_390.png',fullPage:false});
                console.log('PASS '+dossierSlugs.length+' deep dossiers in '+locale+' at 390px: content, SEO, accessible language and overflow');
              }
              // Functional direction filter: two independent samples per offered direction.
              await page.goto('http://127.0.0.1:4173/it/esempi-di-lavoro',{waitUntil:'networkidle'});
              const deepDirectory=page.locator('#portfolio-complete-dossiers');
              if(await deepDirectory.locator('article').count()!==8) throw Error('Expected curated first-eight dossier selection');
              await deepDirectory.getByRole('button',{name:'Esplora tutti i dossier (27)'}).click();
              if(await deepDirectory.locator('article').count()!==27) throw Error('Deep dossier directory not complete');
              await deepDirectory.getByRole('button',{name:'IT → ES'}).click();
              if(await deepDirectory.locator('article').count()!==2) throw Error('IT to ES dossier filter should show two samples');
              await deepDirectory.getByRole('button',{name:'Ricerche informative'}).click();
              if(await deepDirectory.locator('article').count()!==2) throw Error('Research service filter missing');
              console.log('PASS 27 dossier directory and translation/service filters');

              // Until the new provider has been verified, NEVER transmit personal data
              // to the previously failing provider. The visitor gets a usable manual draft.
              await page.setViewportSize({width:1365,height:900});
              let attemptedPosts = 0;
              await page.route(/https:\/\/(formsubmit\.co|api\.web3forms\.com)\//, async route => {
                attemptedPosts++;
                await route.fulfill({status:403, contentType:'text/html', body:'<html>Just a moment...</html>'});
              });
              await page.goto('http://127.0.0.1:4173/it/contatti',{waitUntil:'networkidle'});
              await page.locator('#form-firstName').fill('Cliente');
              await page.locator('#form-lastName').fill('Test');
              await page.locator('#form-email').fill('test@example.org');
              await page.locator('#form-service').selectOption({index:1});
              await page.locator('#form-message').fill('TEST MODULO SITO: nessun incarico reale e nessuna email da inviare.');
              await page.locator('#form-gdprConsent').check();
              await page.locator('button[type="submit"]').click();
              await page.getByRole('alert').waitFor({timeout:10000});
              const alertText=await page.getByRole('alert').innerText();
              if(!alertText.includes('non è ancora attivo')) throw new Error('Missing unconfigured-provider notice: '+alertText.slice(0,300));
              const emailLink=page.getByRole('link',{name:'Apri email già compilata'});
              const href=await emailLink.getAttribute('href');
              if(!href?.startsWith('mailto:info@noemitomassetti.it?') || !decodeURIComponent(href).includes('nessun incarico reale'))
                throw new Error('Manual email fallback failed to preserve the enquiry');
              if(await page.locator('#form-message').inputValue() !== 'TEST MODULO SITO: nessun incarico reale e nessuna email da inviare.')
                throw new Error('Failed request was not preserved');
              if(attemptedPosts!==0) throw new Error('Unexpected provider request without configured provider: '+attemptedPosts);
              await page.screenshot({path:'/tmp/noemi-smoke/provider_unconfigured_manual_fallback.png',fullPage:true});
              console.log('PASS unconfigured provider - zero attempted POSTs, preserved text and manual email fallback');
              if(errors.length) throw new Error('Browser JS exceptions: '+errors.slice(0,5).join(' | '));
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Test Web3Forms browser success and failure with simulated provider
        shell: bash
        run: |
          # A temporary public example key is injected ONLY into this CI build.
          # All network requests to Web3Forms are mocked by the test browser.
          VITE_WEB3FORMS_ACCESS_KEY=12345678-1234-1234-1234-123456789012 npm run build
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/site-web3forms-preview.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            try {
              const page=await browser.newPage({viewport:{width:1280,height:850}});
              let requests=0;
              let responseType='success';
              await page.route('https://api.web3forms.com/submit', async route => {
                requests++;
                const body=route.request().postDataJSON();
                if(body.access_key!=='12345678-1234-1234-1234-123456789012') throw Error('Wrong Web3Forms key');
                if(body.email!=='contact-test@example.org' || !body.message.includes('TEST DI COLLAUDO')) throw Error('Form data incomplete');
                if(responseType==='success') {
                  await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,message:'Mock accepted'})});
                } else {
                  await route.fulfill({status:403,contentType:'application/json',body:JSON.stringify({success:false,message:'Mock provider blocked'})});
                }
              });
              async function fillForm(){
                await page.goto('http://127.0.0.1:4174/it/contatti',{waitUntil:'networkidle'});
                await page.locator('#form-firstName').fill('Cliente');
                await page.locator('#form-lastName').fill('Collaudo');
                await page.locator('#form-email').fill('contact-test@example.org');
                await page.locator('#form-service').selectOption({index:1});
                await page.locator('#form-message').fill('TEST DI COLLAUDO: verifica invio simulato, nessun dato reale.');
                await page.locator('#form-gdprConsent').check();
              }
              await fillForm();
              await page.locator('button[type=submit]').click();
              await page.getByText(/servizio di inoltro email ha accettato la richiesta/i).waitFor({timeout:10000});
              if(requests!==1) throw Error('Expected one provider request after mocked success; got '+requests);
              console.log('PASS Web3Forms mocked success with one POST and truthful provider acknowledgement');
              responseType='failure';
              await fillForm();
              await page.locator('button[type=submit]').click();
              await page.getByRole('alert').waitFor({timeout:10000});
              const fallback=page.getByRole('link',{name:'Apri email già compilata'});
              if(!await fallback.isVisible()) throw Error('No manual fallback after Web3Forms error');
              if(requests!==2) throw Error('Expected one POST per form; got '+requests);
              console.log('PASS Web3Forms mocked 403 with preserved request and manual fallback');
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noemi-site-browser-smoke
          path: /tmp/noemi-smoke/*.png
          if-no-files-found: ignore
