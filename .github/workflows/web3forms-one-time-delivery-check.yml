name: One-time Web3Forms live relay check

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/web3forms-one-time-delivery-check.yml'

permissions:
  contents: read

jobs:
  one-time-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Send ONE synthetic enquiry through configured public Web3Forms key
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/lib/api/web3formsPublicConfig.ts', 'utf8');
          const match = source.match(/WEB3FORMS_PUBLIC_ACCESS_KEY\s*=\s*['"]([^'"]+)['"]/);
          if (!match) throw new Error('Public Web3Forms identifier not found');
          const reference = 'NOEMI-QUOTE-DELIVERY-QA-20261109-ONE';
          const body = {
            access_key: match[1],
            name: 'Collaudo modulo sito Noemi',
            email: 'web3forms-qa@example.com',
            subject: 'TEST SITO NOEMI - richiesta preventivo - ' + reference,
            message: 'Messaggio sintetico di collaudo autorizzato: verificare se questa email e arrivata a info@noemitomassetti.it. Non e una richiesta reale di un cliente. Riferimento ' + reference,
            servizio: 'Richiesta generale - TEST',
            lingua: 'IT',
            riferimento: reference,
            privacy_letta: 'Sì - test sintetico',
            botcheck: false
          };
          (async () => {
            const resp = await fetch('https://api.web3forms.com/submit', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(20000)
            });
            const raw = await resp.text();
            let data;
            try { data = JSON.parse(raw); } catch { data = { message: raw.slice(0, 400) }; }
            console.log('REF: ' + reference);
            console.log('Web3Forms HTTP: ' + resp.status);
            console.log('Web3Forms success: ' + String(data.success));
            console.log('Web3Forms response: ' + String(data.message || '').slice(0, 350));
            console.log('IMPORTANT: Provider acceptance does NOT prove delivery to info@noemitomassetti.it.');
            if (!resp.ok || data.success !== true) process.exitCode = 1;
          })().catch(err => { console.log('Web3Forms network check error: ' + err.message); process.exitCode = 1; });
          NODE
