name: FormSubmit delivery acceptance smoke (one synthetic request)
on:
  push:
    branches:
      - 'chatgpt/site-release-audit-2026-10-29'
    paths:
      - '.github/QA_EMAIL_TRIGGER.txt'

permissions:
  contents: read

jobs:
  synthetic-provider-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit one synthetic contact request to existing provider recipient
        shell: bash
        run: |
          set -euo pipefail
          # Test uses only the owner's address and a fictional, unmistakable test message.
          # Never treat provider acceptance as proof of inbox delivery.
          cat > /tmp/noemi-test-message.json <<'JSON'
          {
            "nome": "COLLAUDO TECNICO - NON CLIENTE",
            "email": "noemitom@gmail.com",
            "messaggio": "TEST AUTOMATICO DEL MODULO NOEMITOMASSETTI.IT: verificare ricezione Gmail. Nessuna richiesta commerciale o incarico.",
            "servizio": "verifica_invio",
            "lingua": "IT",
            "informativa_privacy_letta": "Si (test)",
            "identificativo_richiesta": "QA-SITO-29-10-2026",
            "_subject": "[TEST SITO] Verifica arrivo modulo Noemi 29-10-2026",
            "_replyto": "noemitom@gmail.com",
            "_captcha": "false"
          }
          JSON
          status=$(curl -sS --max-time 25 -o /tmp/noemi-provider-response.txt -w '%{http_code}' \
            -X POST 'https://formsubmit.co/ajax/noemitom%40gmail.com' \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data-binary @/tmp/noemi-test-message.json)
          echo "FormSubmit HTTP status: $status"
          head -c 800 /tmp/noemi-provider-response.txt
          echo ""
          test "$status" = "200"
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/noemi-provider-response.txt'))
          assert x.get('success') is True or x.get('success') == 'true', x
          print('ACCEPTED BY PROVIDER. INBOX DELIVERY STILL UNVERIFIED.')
          PY
