name: Import site release candidate (isolated branch only)
on:
  push:
    branches:
      - 'chatgpt/site-release-audit-2026-10-29'
    paths:
      - '.github/release-transport/READY.txt'

permissions:
  contents: write

concurrency:
  group: site-release-import-29oct
  cancel-in-progress: false

jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Ensure isolated branch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "chatgpt/site-release-audit-2026-10-29"
          test -f .github/release-transport/READY.txt
          test "$(ls .github/release-transport/part*.b64 | wc -l)" -eq 9
      - name: Verify and import updated site source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/release-transport/part*.b64 | tr -d '\n\r' | base64 -d > /tmp/site-release-source.tar.xz
          echo "5cf49cd543d58a44caa6df4e54d419b7e0eeec4f38ff1595c1b68da7a7128f31  /tmp/site-release-source.tar.xz" | sha256sum -c -
          tar -tJf /tmp/site-release-source.tar.xz | grep -E '(^/|(^|/)\.\.(/|$))' && exit 1 || true
          tar -xJf /tmp/site-release-source.tar.xz -C .
          test -f src/components/DigitalConcierge.tsx
          test -f src/lib/api/clientAdapter.ts
          test -f public/portfolio-documenti/doc-20-richiesta-preventivo-workflow.html
          cp .github/release-fixes/src/pages/BlogPost.tsx src/pages/BlogPost.tsx
          cp .github/release-fixes/src/pages/Questionnaire.tsx src/pages/Questionnaire.tsx
          cp .github/release-fixes/src/hooks/useSEO.ts src/hooks/useSEO.ts
          rm -rf .github/release-transport .github/release-fixes
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Offline preflight
        run: npm run preflight:offline
      - name: Release checks
        run: npm run test:release
      - name: Unit tests
        run: npm test -- --passWithNoTests
      - name: Production build
        run: npm run build
      - name: Save passing release source to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat(site): import tested 29 October release candidate"
            git push origin "HEAD:refs/heads/chatgpt/site-release-audit-2026-10-29"
          fi
