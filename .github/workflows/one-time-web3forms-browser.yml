name: One-time browser Web3Forms acceptance diagnostic
on:
  push:
    branches:
      - chatgpt/site-release-audit-2026-10-29
    paths:
      - .github/workflows/one-time-web3forms-browser.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Build with Web3Forms public form identifier
        run: npm run build
      - name: Start local production build
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/site-serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
      - name: Submit one explicitly labeled synthetic enquiry from Chromium
        shell: bash
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            try {
              const page = await browser.newPage();
              page.on('console',msg=> { if (msg.type()==='error') console.log('Browser console:',msg.text().slice(0,300)); });
              await page.goto('http://127.0.0.1:4173/it/contatti',{waitUntil:'networkidle'});
              await page.locator('#form-firstName').fill('Collaudo');
              await page.locator('#form-lastName').fill('Tecnico');
              await page.locator('#form-email').fill('noemitom@gmail.com');
              await page.locator('#form-service').selectOption({index:1});
              await page.locator('#form-message').fill('TEST TECNICO Web3Forms 02/11/2026. Questo messaggio non è una richiesta di un cliente. Verifica solo la ricezione del modulo del sito Noemi Tomassetti.');
              await page.locator('#form-gdprConsent').check();
              const response = page.waitForResponse(r=>r.url().startsWith('https://api.web3forms.com/submit') && r.request().method()==='POST',{timeout:25000});
              await page.locator('button[type=submit]').click();
              const r = await response;
              const body = await r.text().catch(()=>'<unreadable body>');
              console.log('Browser Web3Forms response HTTP:',r.status(),'body:',body.slice(0,800));
              let json={}; try{json=JSON.parse(body)}catch{}
              if(!r.ok() || json.success!==true) throw new Error('Web3Forms did not accept the browser submission');
              console.log('PROVIDER ACCEPTED ONE SYNTHETIC BROWSER TEST. Final inbox delivery still needs independent confirmation.');
            } finally { await browser.close(); }
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
